<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad Pro</title>
<!-- Fonts with fallback: Vazirmatn for RTL, Fira Code for LTR -->
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- Markdown Parser with fallback CDN -->
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js" 
        onerror="loadFallbackMarked()"></script>
<script src="https://unpkg.com/marked@4.3.0/marked.min.js" 
        onerror="loadFallbackMarked()"></script>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root {
    --bg:#0a0b10;--surface:#13151c;--surface2:#1b1e28;--surface3:#262a38;
    --border:#3a3f55;--border-strong:#5a6080;
    --text:#ffffff;--text2:#d4d7e5;--text3:#8a8fa8;
    --accent:#7c6cff;--accent2:#9d8fff;--accent-glow:rgba(124,108,255,.2);
    --danger:#ff5c5c;--danger-bg:rgba(255,92,92,.15);
    --success:#3ddc84;--success-bg:rgba(61,220,132,.15);
    --warn:#ffc93c;--warn-bg:rgba(255,201,60,.15);
    --line-num:#4a4f68;--line-num-active:#9d8fff;
    --radius:10px;--radius-sm:6px;
    --sidebar-w:240px;
    --header-h:44px;--footer-h:38px;
    --transition:all .2s cubic-bezier(.4,0,.2,1);
    --font-size:15px;--line-height:1.5;
    --font-family: 'Tahoma', 'Arial', 'Vazirmatn', sans-serif;
  }

  [data-theme="light"] {
    --bg:#ffffff;--surface:#f0f1f5;--surface2:#e4e6ec;--surface3:#d5d8e0;
    --border:#b8bcc8;--border-strong:#8a90a5;
    --text:#0a0b10;--text2:#2a2d3a;--text3:#5a5f75;
    --accent:#5a47e0;--accent2:#7c6cff;--accent-glow:rgba(90,71,224,.12);
    --danger:#d63030;--danger-bg:rgba(214,48,48,.1);
    --success:#1a9a5a;--success-bg:rgba(26,154,90,.1);
    --warn:#d49500;--warn-bg:rgba(212,149,0,.1);
    --line-num:#8a90a5;--line-num-active:#5a47e0;
  }

  [data-theme="nord"] {
    --bg:#2E3440;--surface:#3B4252;--surface2:#434C5E;--surface3:#4C566A;
    --border:#4C566A;--border-strong:#616E88;
    --text:#ECEFF4;--text2:#D8DEE9;--text3:#93A1A1;
    --accent:#88C0D0;--accent2:#81A1C1;--accent-glow:rgba(136,192,208,.2);
    --danger:#BF616A;--danger-bg:rgba(191,97,106,.15);
    --success:#A3BE8C;--success-bg:rgba(163,190,140,.15);
    --warn:#EBCB8B;--warn-bg:rgba(235,203,139,.15);
    --line-num:#616E88;--line-num-active:#88C0D0;
  }

  [data-theme="dracula"] {
    --bg:#282A36;--surface:#21222C;--surface2:#282A36;--surface3:#44475A;
    --border:#44475A;--border-strong:#6272A4;
    --text:#F8F8F2;--text2:#F8F8F2;--text3:#6272A4;
    --accent:#FF79C6;--accent2:#BD93F9;--accent-glow:rgba(255,121,198,.2);
    --danger:#FF5555;--danger-bg:rgba(255,85,85,.15);
    --success:#50FA7B;--success-bg:rgba(80,250,123,.15);
    --warn:#F1FA8C;--warn-bg:rgba(241,250,140,.15);
    --line-num:#6272A4;--line-num-active:#FF79C6;
  }

  [data-theme="green"] {
    --bg:#022c22;--surface:#064e3b;--surface2:#065f46;--surface3:#047857;
    --border:#059669;--border-strong:#10b981;
    --text:#ecfdf5;--text2:#d1fae5;--text3:#6ee7b7;
    --accent:#34d399;--accent2:#6ee7b7;--accent-glow:rgba(52,211,153,.2);
    --danger:#f87171;--danger-bg:rgba(248,113,113,.15);
    --success:#4ade80;--success-bg:rgba(74,222,128,.15);
    --warn:#facc15;--warn-bg:rgba(250,204,21,.15);
    --line-num:#065f46;--line-num-active:#34d399;
  }

  [data-theme="greentext"] {
    --bg:#000000;--surface:#0a0a0a;--surface2:#111111;--surface3:#1a1a1a;
    --border:#003300;--border-strong:#005500;
    --text:#00ff41;--text2:#00cc33;--text3:#008000;
    --accent:#00ff41;--accent2:#39ff14;--accent-glow:rgba(0,255,65,.15);
    --danger:#ff0000;--danger-bg:rgba(255,0,0,.1);
    --success:#00ff41;--success-bg:rgba(0,255,65,.1);
    --warn:#ffff00;--warn-bg:rgba(255,255,0,.1);
    --line-num:#004400;--line-num-active:#00ff41;
  }

  [data-theme="green-hc"] {
    --bg:#000000;--surface:#001100;--surface2:#002200;--surface3:#003300;
    --border:#00ff00;--border-strong:#00ff41;
    --text:#00ff41;--text2:#39ff14;--text3:#00cc33;
    --accent:#ffff00;--accent2:#ffffff;--accent-glow:rgba(255,255,0,.3);
    --danger:#ff0000;--danger-bg:rgba(255,0,0,.2);
    --success:#00ff41;--success-bg:rgba(0,255,65,.2);
    --warn:#ffff00;--warn-bg:rgba(255,255,0,.2);
    --line-num:#005500;--line-num-active:#ffff00;
  }

  html{font-size:var(--font-size)}
  body{
    font-family: var(--font-family);
    background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    transition:background .3s,color .3s;
  }

  .header{
    height:var(--header-h);display:flex;align-items:center;gap:8px;
    padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);
    flex-shrink:0;z-index:10;
  }
  .logo{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem}
  .logo span{font-size:1.1rem}
  .header-spacer{flex:1}
  .search-box{
    display:flex;align-items:center;gap:6px;background:var(--surface2);
    border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:0 10px;height:30px;transition:var(--transition);min-width:0;
  }
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
  .search-box input{
    background:transparent;border:none;outline:none;color:var(--text);
    font-family:inherit;font-size:.82rem;width:140px;
  }
  .search-box input::placeholder{color:var(--text3)}
  .search-box .icon{color:var(--text3);font-size:.85rem}
  .icon-btn{
    width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
    color:var(--text2);cursor:pointer;transition:var(--transition);
    font-size:.9rem;flex-shrink:0;
  }
  .icon-btn:hover{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
  .mobile-toggle{display:none}

  .theme-select, .font-size-select, .font-family-select {
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text);border-radius:var(--radius-sm);padding:0 8px;
    font-size:.75rem;cursor:pointer;outline:none;font-family:inherit;
    height:30px;transition:var(--transition);
  }
  .theme-select:focus, .font-size-select:focus, .font-family-select:focus {border-color:var(--accent)}

  .app{display:flex;flex:1;overflow:hidden}

  .editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);order:1}

  .editor-toolbar{
    display:flex;align-items:center;gap:4px;padding:4px 8px;
    background:var(--surface);border-bottom:1px solid var(--border);
    flex-shrink:0;flex-wrap:wrap;
  }
  .toolbar-group{display:flex;align-items:center;gap:2px}
  .toolbar-sep{width:1px;height:16px;background:var(--border);margin:0 6px}
  .toolbar-label{font-size:.65rem;color:var(--text3);margin-right:4px;user-select:none}

  .tb-btn{
    height:24px;min-width:24px;padding:0 8px;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    background:var(--surface2);border:1px solid var(--border);
    border-radius:4px;color:var(--text2);cursor:pointer;
    transition:var(--transition);font-family:inherit;
    font-size:.72rem;font-weight:600;white-space:nowrap;
  }
  .tb-btn:hover{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
  .tb-btn.active{background:var(--accent);border-color:var(--accent);color:#000}
  .tb-btn .ico{font-size:.8rem;line-height:1}

  .editor-wrap{
    flex:1;display:flex;overflow:hidden;position:relative;padding:0;
  }
  .line-numbers{
    flex-shrink:0;padding:12px 8px 12px 12px;
    background:var(--surface);border-left:1px solid var(--border);
    color:var(--line-num);font-family:'Consolas', 'Courier New', monospace;
    font-size:var(--font-size);line-height:var(--line-height);
    text-align:right;user-select:none;overflow:hidden;min-width:45px;
  }
  .line-numbers .line-num{display:block}
  .line-numbers .line-num.active{color:var(--line-num-active);font-weight:700}

  .editor-content{
    flex:1;resize:none;background:transparent;border:none;
    color:var(--text);font-size:var(--font-size);line-height:var(--line-height);
    outline:none;padding:12px 16px;overflow-y:auto;
    font-family: var(--font-family);
  }
  
  .editor-content.no-wrap {
    white-space: pre;
    word-wrap: normal;
    overflow-x: auto;
  }
  
  .editor-content.wrap-text {
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-x: hidden;
  }

  .editor-content.ltr { direction:ltr; text-align:left; }
  .editor-content.rtl { direction:rtl; text-align:right; padding-right: 20px; padding-left: 16px; }

  .editor-content.preview-mode {
    font-family: var(--font-family);
    white-space: pre-wrap;
  }
  .editor-content.preview-mode h1, .editor-content.preview-mode h2, .editor-content.preview-mode h3 {
    color:var(--accent); margin: 6px 0 2px 0; border-bottom:1px solid var(--border); padding-bottom:2px;
  }
  .editor-content.preview-mode p { margin-bottom: 4px; line-height: 1.5; }
  .editor-content.preview-mode code {
    background:var(--surface2); padding:2px 5px; border-radius:4px; font-family:'Consolas', 'Courier New', monospace; font-size:0.9em;
  }
  .editor-content.preview-mode pre {
    background:var(--surface2); padding: 8px; border-radius:6px; 
    overflow-x: auto; white-space: pre; margin: 4px 0;
    position: relative;
  }
  .editor-content.preview-mode pre code { background:transparent; padding:0; }
  .editor-content.preview-mode blockquote {
    border-left:3px solid var(--accent); padding-left:10px; color:var(--text2); margin: 4px 0;
  }
  
  .editor-content.preview-mode hr {
    border: none;
    border-top: 1px solid var(--border-strong);
    margin: 8px 0;
  }

  .editor-content.preview-mode table {
    border-collapse: collapse;
    width: 100%;
    margin: 6px 0;
    font-size: 0.95em;
  }
  .editor-content.preview-mode th, .editor-content.preview-mode td {
    border: 1px solid var(--border);
    padding: 4px 8px;
    text-align: left;
  }
  .editor-content.preview-mode th {
    background: var(--surface2);
    font-weight: 600;
  }
  .editor-content.preview-mode tr:nth-child(even) {
    background: var(--surface);
  }

  .editor-content.preview-mode del {
    text-decoration: line-through;
    color: var(--text3);
  }

  .editor-content.preview-mode mark {
    background: var(--warn-bg);
    color: var(--warn);
    padding: 1px 3px;
    border-radius: 3px;
  }

  .editor-content.preview-mode ul, .editor-content.preview-mode ol { 
    padding-left: 1.2em; 
    margin-top: 0px; 
    margin-bottom: 0px; 
  }
  .editor-content.preview-mode li { 
    margin: 0;
    padding: 0;
    line-height: 1.4;
  }
  .editor-content.preview-mode li > p {
    margin: 0;
    padding: 0;
    display: inline; 
  }
  .editor-content.preview-mode .task-list-item { 
    list-style: none; 
    margin-left: -1.2em; 
  }
  .editor-content.preview-mode .md-checkbox {
    accent-color: var(--accent); 
    width: 1em; 
    height: 1em; 
    cursor: pointer; 
    margin-right: 6px; 
    margin-top: 2px;
    vertical-align: middle; 
    pointer-events: auto;
  }

  .editor-wrap.rtl{flex-direction:row-reverse}
  .editor-wrap.rtl .line-numbers{
    border-left:none;border-right:1px solid var(--border);
    text-align:left;padding:12px 12px 12px 16px;
    font-family:'Tahoma', monospace;
    min-width:50px;
  }
  .editor-wrap.rtl .editor-content.preview-mode .md-checkbox { 
    margin-right: 0; 
    margin-left: 6px; 
  }
  .editor-wrap.rtl .editor-content.preview-mode ul,
  .editor-wrap.rtl .editor-content.preview-mode ol {
    padding-left: 0;
    padding-right: 1.2em;
  }
  .editor-wrap.rtl .editor-content.preview-mode .task-list-item {
    margin-left: 0;
    margin-right: -1.2em;
  }
  .editor-wrap.rtl .editor-content.preview-mode blockquote {
    border-left: none;
    border-right: 3px solid var(--accent);
    padding-left: 0;
    padding-right: 10px;
  }

  .empty-state{
    flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;color:var(--text3);
  }
  .empty-state .icon{font-size:3rem;opacity:.3}
  .empty-state p{font-size:.9rem}

  .sidebar{
    width:var(--sidebar-w);flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    overflow:hidden;transition:var(--transition);order:2;
  }
  .sidebar-head{
    padding:8px 10px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .sidebar-head h2{font-size:.78rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .note-count{
    font-size:.65rem;background:var(--surface3);color:var(--text2);
    padding:1px 7px;border-radius:10px;font-weight:700;
  }
  .tabs-list{flex:1;overflow-y:auto;padding:4px}
  .tabs-list::-webkit-scrollbar{width:4px}
  .tabs-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

  .tab-item{
    display:flex;align-items:center;gap:6px;padding:6px 10px;
    border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);
    margin-bottom:1px;border:1px solid transparent;position:relative;
    font-size:.8rem;
  }
  .tab-item:hover{background:var(--surface2)}
  .tab-item.active{background:var(--accent-glow);border-color:rgba(124,108,255,.35)}
  .tab-item .tab-icon{font-size:.85rem;flex-shrink:0;opacity:.5}
  .tab-item.active .tab-icon{opacity:1}
  .tab-title{
    flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    outline:none;color:var(--text2);
  }
  .tab-item.active .tab-title{color:var(--text);font-weight:600}
  .tab-delete{
    opacity:0;border:none;background:none;color:var(--text3);
    cursor:pointer;font-size:.85rem;padding:0 3px;border-radius:3px;
    transition:var(--transition);flex-shrink:0;line-height:1;
  }
  .tab-item:hover .tab-delete{opacity:1}
  .tab-delete:hover{color:var(--danger);background:var(--danger-bg)}

  .sidebar-footer{padding:6px;border-top:1px solid var(--border)}
  .add-btn{
    width:100%;padding:6px;border:1px dashed var(--border);
    border-radius:var(--radius-sm);background:transparent;
    color:var(--text2);font-size:.78rem;cursor:pointer;
    transition:var(--transition);font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}

  .footer{
    height:var(--footer-h);display:flex;align-items:center;gap:6px;
    padding:0 12px;background:var(--surface);border-top:1px solid var(--border);
    flex-shrink:0;
  }
  .save-status{
    display:flex;align-items:center;gap:5px;font-size:.72rem;
    padding:2px 10px;border-radius:12px;font-weight:600;
    transition:var(--transition);white-space:nowrap;
  }
  .save-status.saved{background:var(--success-bg);color:var(--success)}
  .save-status.saving{background:var(--warn-bg);color:var(--warn)}
  .save-status.unsaved{background:var(--danger-bg);color:var(--danger)}
  .save-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
  .save-status.saving .save-dot{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .footer-spacer{flex:1}
  .footer-btn{
    display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
    border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface2);color:var(--text2);font-size:.72rem;
    cursor:pointer;transition:var(--transition);font-family:inherit;
    white-space:nowrap;height:26px;
  }
  .footer-btn:hover{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
  .footer-btn.danger{border-color:var(--danger);color:var(--danger)}
  .footer-btn.danger:hover{background:var(--danger-bg)}
  #importInput{display:none}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
    z-index:200;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);
  }
  .modal-overlay.show{display:flex}
  .modal{
    background:var(--surface);border:1px solid var(--border-strong);
    border-radius:var(--radius);padding:24px;max-width:380px;width:90%;
    text-align:center;
  }
  .modal h3{margin-bottom:10px;font-size:1rem}
  .modal p{color:var(--text2);font-size:.85rem;margin-bottom:20px;line-height:1.6}
  .modal-actions{display:flex;gap:8px;justify-content:center}

  .cdn-warning{
    display:none;
    position:fixed;
    top:60px;
    right:20px;
    background:var(--warn-bg);
    color:var(--warn);
    padding:10px 16px;
    border-radius:var(--radius-sm);
    border:1px solid var(--warn);
    font-size:.85rem;
    z-index:1000;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  .cdn-warning.show{display:block}

  /* --- LOCK SCREEN UI --- */
  .lock-screen{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .lock-box{
    background:var(--surface);border:1px solid var(--border-strong);
    border-radius:var(--radius);padding:32px 28px;max-width:420px;width:100%;
    text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.4);
  }
  .lock-box .lock-icon{font-size:3rem;margin-bottom:12px;opacity:.8}
  .lock-box h2{font-size:1.2rem;margin-bottom:8px;color:var(--text)}
  .lock-box p{color:var(--text2);font-size:.88rem;line-height:1.6;margin-bottom:20px}
  .lock-box .lock-actions{display:flex;flex-direction:column;gap:8px}
  .lock-box .lock-btn{
    padding:10px 16px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface2);
    color:var(--text);font-size:.85rem;cursor:pointer;
    transition:var(--transition);font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .lock-box .lock-btn:hover{background:var(--surface3);border-color:var(--accent);color:var(--accent)}
  .lock-box .lock-btn.danger{border-color:var(--danger);color:var(--danger)}
  .lock-box .lock-btn.danger:hover{background:var(--danger-bg)}
  .lock-box .lock-hint{
    margin-top:16px;font-size:.75rem;color:var(--text3);
    padding:8px;background:var(--surface2);border-radius:var(--radius-sm);
    border-left:3px solid var(--warn);text-align:left;
  }
  /* ------------------------ */

  /* --- NEW FEATURES CSS --- */
  .copy-code-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--surface3);
    color: var(--text2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.75rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s, color 0.2s;
    font-family: inherit;
    z-index: 10;
  }
  .editor-content.preview-mode pre:hover .copy-code-btn {
    opacity: 1;
  }
  .copy-code-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .copy-code-btn.copied {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
    opacity: 1;
  }

  .table-toolbar {
    display: inline-flex;
    gap: 4px;
    padding: 3px 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-top: 8px;
    margin-bottom: 4px;
  }
  .table-toolbar + table {
    margin-top: 0;
  }
  .table-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: transparent;
    border: none;
    border-radius: 3px;
    color: var(--text3);
    font-size: 0.85rem;
    cursor: pointer;
    transition: var(--transition);
  }

<script>
// --- ENCRYPTION HELPERS (Web Crypto API - Lightweight & Secure) ---
let APP_PASSWORD = '';
const enc = new TextEncoder();
const dec = new TextDecoder();

async function getKey(password, salt) {
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
  );
}

async function encryptData(text, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await getKey(password, salt);
  const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
  return btoa(String.fromCharCode(...salt)) + ':' + 
         btoa(String.fromCharCode(...iv)) + ':' + 
         btoa(String.fromCharCode(...new Uint8Array(encrypted)));
}

async function decryptData(encryptedStr, password) {
  try {
    const [saltB64, ivB64, dataB64] = encryptedStr.split(':');
    if (!saltB64 || !ivB64 || !dataB64) throw new Error("Invalid format");
    const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
    const data = Uint8Array.from(atob(dataB64), c => c.charCodeAt(0));
    const key = await getKey(password, salt);
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
    return dec.decode(decrypted);
  } catch (e) {
    return null;
  }
}

function resetAllData() {
  const confirmMsg = "⚠️ This will PERMANENTLY DELETE all your encrypted notes and settings.\n\nYou will NOT be able to recover them.\n\nType 'DELETE' to confirm:";
  const userInput = prompt(confirmMsg);
  if (userInput === 'DELETE') {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(STORAGE_KEY + '_active');
    localStorage.removeItem(SETTINGS_KEY);
    alert('✅ All data has been cleared. The page will now reload.');
    location.reload();
  } else if (userInput !== null) {
    alert('❌ Reset cancelled. You must type DELETE exactly to confirm.');
  }
}

function showLockScreen(message, isWrongPassword) {
  document.body.innerHTML = `
    <div class="lock-screen">
      <div class="lock-box">
        <div class="lock-icon">🔒</div>
        <h2>${isWrongPassword ? 'Wrong Password' : 'Access Denied'}</h2>
        <p>${message}</p>
        <div class="lock-actions">
          <button class="lock-btn" onclick="location.reload()">🔄 Retry</button>
          <button class="lock-btn danger" onclick="resetAllData()">🗑️ Reset All Data</button>
        </div>
        <div class="lock-hint">
          💡 <strong>Forgot your password?</strong> Your data is encrypted and cannot be recovered without it. 
          Use "Reset All Data" to start fresh (all notes will be lost permanently).
        </div>
      </div>
    </div>
  `;
}

function loadFallbackMarked() {
  console.warn('CDN failed to load marked.js. Using fallback parser.');
  document.getElementById('cdnWarning').classList.add('show');
  setTimeout(() => {
    document.getElementById('cdnWarning').classList.remove('show');
  }, 5000);
}

let markedAvailable = typeof window.marked !== 'undefined';

function fallbackMarkdownParse(text) {
  if (!text) return '';
  let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
  html = html.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
  html = html.replace(/`(.*?)`/g, '<code>$1</code>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

const STORAGE_KEY = 'notepad_data_v3';
const SETTINGS_KEY = 'notepad_settings_v3';
const DEBOUNCE_MS = 500;

let notes = [];
let activeId = null;
let saveTimer = null;
let settings = {
  theme: 'dark',
  fontSize: 15,
  fontFamily: "'Tahoma', 'Arial', sans-serif",
  align: 'rtl',
  showLineNumbers: true,
  wrapText: false,
  viewMode: 'edit'
};

if (markedAvailable) {
  marked.setOptions({ gfm: true, breaks: true, headerIds: false, mangle: false });
}

async function init() {
  APP_PASSWORD = prompt("Enter encryption password for your notes:");
  if (!APP_PASSWORD) {
    showLockScreen("No password was provided. Your encrypted notes are still stored safely in your browser.", false);
    return;
  }

  const notesOk = await loadFromStorage();
  const settingsOk = await loadSettings();

  if (!notesOk || !settingsOk) {
    showLockScreen("The password you entered is incorrect, or the stored data is corrupted. Please try again or reset all data.", true);
    return;
  }

  applySettings();
  renderTabs();
  if (notes.length > 0) {
    const lastActive = localStorage.getItem(STORAGE_KEY + '_active');
    selectNote(lastActive && notes.find(n => n.id === lastActive) ? lastActive : notes[0].id);
  } else {
    showEmpty();
  }
  setupEditorEvents();
}

async function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return true;
    const decrypted = await decryptData(raw, APP_PASSWORD);
    if (decrypted === null) return false;
    settings = { ...settings, ...JSON.parse(decrypted) };
    return true;
  } catch { return true; }
}

async function saveSettings() {
  try {
    const encrypted = await encryptData(JSON.stringify(settings), APP_PASSWORD);
    localStorage.setItem(SETTINGS_KEY, encrypted);
  } catch (e) { console.error('Settings save error:', e); }
}

function applySettings() {
  document.documentElement.setAttribute('data-theme', settings.theme);
  document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
  document.documentElement.style.setProperty('--font-family', settings.fontFamily);
  
  document.getElementById('themeSelect').value = settings.theme;
  document.getElementById('fontSizeSelect').value = settings.fontSize;
  document.getElementById('fontFamilySelect').value = settings.fontFamily;
  
  updateAlignUI();
  updateLineNumbersUI();
  updateViewModeUI();
  updateWrapUI();
}

function changeTheme(theme) {
  settings.theme = theme;
  saveSettings(); applySettings();
}

function setFontSize(size) {
  settings.fontSize = parseInt(size);
  saveSettings(); applySettings(); 
  if(settings.viewMode === 'edit') updateLineNumbers();
}

function setFontFamily(font) {
  settings.fontFamily = font;
  saveSettings(); applySettings();
}

function toggleWrap() {
  settings.wrapText = !settings.wrapText;
  saveSettings();
  updateWrapUI();
  if(settings.viewMode === 'edit') updateLineNumbers();
}

function updateWrapUI() {
  const content = document.getElementById('editorContent');
  const btn = document.getElementById('wrapBtn');
  if (settings.wrapText) {
    content.classList.remove('no-wrap');
    content.classList.add('wrap-text');
    btn.classList.add('active');
    btn.innerHTML = '↩️ Wrap';
  } else {
    content.classList.remove('wrap-text');
    content.classList.add('no-wrap');
    btn.classList.remove('active');
    btn.innerHTML = '⇥ No Wrap';
  }
}

function setAlign(dir) {
  settings.align = dir;
  saveSettings(); updateAlignUI();
  if (activeId) {
    const note = getActiveNote();
    if (note) { note.align = dir; note.updatedAt = Date.now(); debouncedSave(); }
  }
}

function updateAlignUI() {
  const content = document.getElementById('editorContent');
  const preview = document.getElementById('previewContent');
  const wrap = document.getElementById('editorWrap');
  
  content.classList.remove('ltr','rtl');
  preview.classList.remove('ltr','rtl');
  wrap.classList.remove('ltr','rtl');
  
  content.classList.add(settings.align);
  preview.classList.add(settings.align);
  wrap.classList.add(settings.align);
  
  document.getElementById('alignLtrBtn').classList.toggle('active', settings.align === 'ltr');
  document.getElementById('alignRtlBtn').classList.toggle('active', settings.align === 'rtl');
}

function setViewMode(mode) {
  settings.viewMode = mode;
  saveSettings();
  const note = getActiveNote();
  if (mode === 'preview') {
    if (note) {
      document.getElementById('editorContent').value = note.content || '';
      renderMarkdown();
    }
  } else {
    if (note) {
      document.getElementById('editorContent').value = note.content || '';
      updateLineNumbers();
    }
  }
  updateViewModeUI();
}

function updateViewModeUI() {
  const editBtn = document.getElementById('viewEditBtn');
  const previewBtn = document.getElementById('viewPreviewBtn');
  const textarea = document.getElementById('editorContent');
  const preview = document.getElementById('previewContent');
  
  editBtn.classList.toggle('active', settings.viewMode === 'edit');
  previewBtn.classList.toggle('active', settings.viewMode === 'preview');
  
  if (settings.viewMode === 'preview') {
    textarea.style.display = 'none';
    preview.style.display = 'block';
    document.getElementById('lineNumbers').style.display = 'none';
  } else {
    textarea.style.display = 'block';
    preview.style.display = 'none';
    updateLineNumbersUI();
  }
}

function toggleCheckboxInText(text, checkboxIndex, isChecked) {
  const lines = text.split('\n');
  let currentCheckbox = 0;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const match = line.match(/^(\s*[-*+]\s+\[)([ xX])(\].*)$/);
    if (match) {
      if (currentCheckbox === checkboxIndex) {
        lines[i] = match[1] + (isChecked ? 'x' : ' ') + match[3];
        break;
      }
      currentCheckbox++;
    }
  }
  return lines.join('\n');
}

function renderMarkdown() {
  const note = getActiveNote();
  if (!note) return;
  const preview = document.getElementById('previewContent');
  let html;
  
  if (markedAvailable) {
    const renderer = new marked.Renderer();
    renderer.link = function(href, title, text) {
      return `<a href="${href}" target="_blank" ${title ? `title="${title}"` : ''}>${text}</a>`;
    };
    html = marked.parse(note.content || '', { renderer: renderer });
    html = html.replace(/==([^=]+)==/g, '<mark>$1</mark>');
  } else {
    html = fallbackMarkdownParse(note.content || '');
  }
  
  preview.innerHTML = html;

  const preBlocks = preview.querySelectorAll('pre');
  preBlocks.forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-code-btn';
    btn.textContent = 'Copy';
    btn.onclick = () => {
      const code = pre.querySelector('code')?.innerText || pre.innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    };
    pre.appendChild(btn);
  });

  enhanceTables();

  const checkboxes = preview.querySelectorAll('input[type="checkbox"]');
  checkboxes.forEach((cb, index) => {
    cb.removeAttribute('disabled');
    cb.classList.add('md-checkbox');
    cb.dataset.index = index;
    if (cb.parentElement && cb.parentElement.tagName === 'LI') {
      cb.parentElement.classList.add('task-list-item');
    }
    cb.addEventListener('change', (e) => {
      const currentNote = getActiveNote();
      if (!currentNote) return;
      const newText = toggleCheckboxInText(currentNote.content, parseInt(e.target.dataset.index), e.target.checked);
      if (newText !== currentNote.content) {
        currentNote.content = newText;
        currentNote.updatedAt = Date.now();
        document.getElementById('editorContent').value = newText;
        updateTabTitle(activeId);
        debouncedSave();
      }
    });
  });
}

function enhanceTables() {
  const preview = document.getElementById('previewContent');
  const tables = preview.querySelectorAll('table');
  tables.forEach((table, tableIndex) => {
    if (table.previousElementSibling && table.previousElementSibling.classList.contains('table-toolbar')) return;
    const toolbar = document.createElement('div');
    toolbar.className = 'table-toolbar';
    toolbar.innerHTML = `
      <button class="table-btn" onclick="toggleTableEdit(this, ${tableIndex})" title="Edit / Save">✏️</button>
      <button class="table-btn" onclick="addTableRow(this, ${tableIndex})" title="Add Row">➕</button>
      <button class="table-btn" onclick="addTableColumn(this, ${tableIndex})" title="Add Column">➕</button>
    `;
    table.parentNode.insertBefore(toolbar, table);
    table.dataset.tableIndex = tableIndex;
  });
}

function toggleTableEdit(btn, tableIndex) {
  const table = btn.closest('.table-toolbar').nextElementSibling;
  const isEditing = table.classList.contains('editing');
  const cells = table.querySelectorAll('th, td');

  if (!isEditing) {
    cells.forEach(cell => { cell.contentEditable = "true"; });
    table.classList.add('editing');
    btn.textContent = '💾';
    btn.classList.add('active');
    btn.title = 'Save & Lock';
  } else {
    cells.forEach(cell => { cell.contentEditable = "false"; });
    table.classList.remove('editing');
    btn.textContent = '✏️';
    btn.classList.remove('active');
    btn.title = 'Edit';
    saveTableToMarkdown(btn, tableIndex);
  }
}

function addTableRow(btn, tableIndex) {
  const table = btn.closest('.table-toolbar').nextElementSibling;
  const firstRow = table.querySelector('tr');
  if (!firstRow) return;
  const colCount = firstRow.children.length;
  const newRow = document.createElement('tr');
  for (let i = 0; i < colCount; i++) {
    const td = document.createElement('td');
    td.textContent = 'New';
    newRow.appendChild(td);
  }
  (table.querySelector('tbody') || table).appendChild(newRow);
}

function addTableColumn(btn, tableIndex) {
  const table = btn.closest('.table-toolbar').nextElementSibling;
  table.querySelectorAll('tr').forEach((row, index) => {
    const cell = index === 0 ? document.createElement('th') : document.createElement('td');
    cell.textContent = index === 0 ? 'New Col' : 'New';
    row.appendChild(cell);
  });
}

function saveTableToMarkdown(btn, tableIndex) {
  const table = btn.closest('.table-toolbar').nextElementSibling;
  const newMd = htmlTableToMarkdown(table);
  const note = getActiveNote();
  if (!note) return;

  const tables = getMarkdownTables(note.content);
  if (tables[tableIndex]) {
    const oldTable = tables[tableIndex];
    const before = note.content.substring(0, oldTable.index);
    const after = note.content.substring(oldTable.index + oldTable.length);
    note.content = before + newMd + ((after.startsWith('\n') || after === '') ? after : '\n' + after);
    note.updatedAt = Date.now();
    document.getElementById('editorContent').value = note.content;
    debouncedSave();
    renderMarkdown();
  }
}

function htmlTableToMarkdown(table) {
  let md = '';
  table.querySelectorAll('tr').forEach((row, rowIndex) => {
    const cells = row.querySelectorAll('th, td');
    let rowMd = '|';
    cells.forEach(cell => { rowMd += ' ' + cell.innerText.replace(/\|/g, '\\|').replace(/\n/g, ' ').trim() + ' |'; });
    md += rowMd + '\n';
    if (rowIndex === 0) {
      let sepMd = '|';
      cells.forEach(() => { sepMd += ' --- |'; });
      md += sepMd + '\n';
    }
  });
  return md.trim();
}

function getMarkdownTables(text) {
  const regex = /^(\|[^\n]+\|\n\|[^\n]+\|\n(?:\|[^\n]+\|\n?)*)/gm;
  const matches = [];
  let match;
  while ((match = regex.exec(text)) !== null) {
    matches.push({ index: match.index, length: match[0].length, content: match[0] });
  }
  return matches;
}

function toggleLineNumbers() {
  settings.showLineNumbers = !settings.showLineNumbers;
  saveSettings(); updateLineNumbersUI();
}

function updateLineNumbersUI() {
  if (settings.viewMode === 'preview') return;
  const ln = document.getElementById('lineNumbers');
  const btn = document.getElementById('lineNumBtn');
  ln.style.display = settings.showLineNumbers ? 'block' : 'none';
  btn.classList.toggle('active', settings.showLineNumbers);
  if (settings.showLineNumbers) updateLineNumbers();
}

async function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { notes = []; return true; }
    const decrypted = await decryptData(raw, APP_PASSWORD);
    if (decrypted === null) return false;
    notes = JSON.parse(decrypted);
    return true;
  } catch { notes = []; return true; }
}

async function saveToStorage() {
  setSaveStatus('saving');
  try {
    const encrypted = await encryptData(JSON.stringify(notes), APP_PASSWORD);
    localStorage.setItem(STORAGE_KEY, encrypted);
    if (activeId) localStorage.setItem(STORAGE_KEY + '_active', activeId);
    setTimeout(() => setSaveStatus('saved'), 250);
  } catch (e) {
    setSaveStatus('unsaved');
    console.error('Storage error:', e);
  }
}

function debouncedSave() {
  setSaveStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToStorage, DEBOUNCE_MS);
}

function setSaveStatus(status) {
  const el = document.getElementById('saveStatus');
  el.className = 'save-status ' + status;
  const txt = el.querySelector('.save-text');
  if (status === 'saved') txt.textContent = 'Saved';
  else if (status === 'saving') txt.textContent = 'Saving...';
  else txt.textContent = 'Error!';
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function addNote() {
  const note = { id: generateId(), title: '', content: '', align: settings.align, createdAt: Date.now(), updatedAt: Date.now() };
  notes.unshift(note);
  saveToStorage(); renderTabs(); selectNote(note.id);
  document.getElementById('editorContent').focus();
  closeSidebarMobile();
}

function deleteNote(id, e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  notes = notes.filter(n => n.id !== id);
  if (activeId === id) {
    activeId = null;
    if (notes.length > 0) selectNote(notes[0].id);
    else showEmpty();
  }
  saveToStorage(); renderTabs();
}

function selectNote(id) {
  activeId = id;
  const note = notes.find(n => n.id === id);
  if (!note) return showEmpty();

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('editorContainer').style.display = 'flex';

  const content = document.getElementById('editorContent');
  content.value = note.content || '';
  
  if (note.align && note.align !== settings.align) settings.align = note.align;
  updateAlignUI();
  
  if (settings.viewMode === 'preview') renderMarkdown();
  else updateLineNumbers();
  
  updateActiveTab();
  localStorage.setItem(STORAGE_KEY + '_active', id);
}

function showEmpty() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('editorContainer').style.display = 'none';
  activeId = null; updateActiveTab();
}

function getActiveNote() { return notes.find(n => n.id === activeId); }

function getNoteTitle(note) {
  if (note.title && note.title.trim()) return note.title.trim();
  if (!note.content) return 'Untitled Note';
  const firstLine = note.content.split('\n')[0].replace(/^[#*\-\[\]xX\s]+/, '').trim();
  if (!firstLine) return 'Untitled Note';
  return firstLine.length > 40 ? firstLine.substring(0, 40) + '...' : firstLine;
}

function renameNote() {
  const note = getActiveNote();
  if (!note) { alert('No note is selected.'); return; }
  const result = prompt('Enter note title (leave empty to use first line of content):', note.title || '');
  if (result === null) return;
  note.title = result.trim();
  note.updatedAt = Date.now();
  renderTabs();
  debouncedSave();
}

function renderTabs() {
  const list = document.getElementById('tabsList');
  const query = document.getElementById('searchInput').value.toLowerCase();
  document.getElementById('noteCount').textContent = notes.length;

  const filtered = notes.filter(n => {
    if (!query) return true;
    const t = getNoteTitle(n).toLowerCase();
    return t.includes(query) || (n.content || '').toLowerCase().includes(query);
  });

  list.innerHTML = filtered.map(n => `
    <div class="tab-item ${n.id === activeId ? 'active' : ''}" data-id="${n.id}" onclick="selectNote('${n.id}');closeSidebarMobile()">
      <span class="tab-icon">📄</span>
      <span class="tab-title">${escapeHtml(getNoteTitle(n))}</span>
      <button class="tab-delete" onclick="deleteNote('${n.id}',event)" title="Delete">✕</button>
    </div>
  `).join('');

  if (filtered.length === 0 && query) {
    list.innerHTML = `<div style="padding:16px;text-align:center;color:var(--text3);font-size:.8rem">No matches</div>`;
  }
}

function updateActiveTab() {
  document.querySelectorAll('.tab-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === activeId);
  });
}

function updateTabTitle(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  const tab = document.querySelector(`.tab-item[data-id="${id}"] .tab-title`);
  if (tab) tab.textContent = escapeHtml(getNoteTitle(note));
}

function setupEditorEvents() {
  const content = document.getElementById('editorContent');
  content.addEventListener('input', () => {
    const note = getActiveNote();
    if (!note) return;
    note.content = content.value;
    note.updatedAt = Date.now();
    updateTabTitle(activeId);
    if (settings.viewMode === 'edit') updateLineNumbers();
    debouncedSave();
  });
  content.addEventListener('scroll', () => {
    document.getElementById('lineNumbers').scrollTop = content.scrollTop;
  });
  content.addEventListener('keyup', updateCurrentLine);
  content.addEventListener('click', updateCurrentLine);
}

function updateCurrentLine() {
  if (settings.viewMode !== 'edit' || !settings.showLineNumbers) return;
  const content = document.getElementById('editorContent');
  const text = content.value.substring(0, content.selectionStart);
  const currentLine = text.split('\n').length;
  document.querySelectorAll('.line-num').forEach((el, i) => {
    el.classList.toggle('active', i + 1 === currentLine);
  });
}

function updateLineNumbers() {
  if (!settings.showLineNumbers || settings.viewMode === 'preview') return;
  const content = document.getElementById('editorContent');
  const ln = document.getElementById('lineNumbers');
  const text = content.value || '';
  const lines = text.split('\n');
  const totalLines = Math.max(1, lines.length);
  const beforeCursor = text.substring(0, content.selectionStart);
  const currentLine = beforeCursor.split('\n').length;

  let html = '';
  for (let i = 1; i <= totalLines; i++) {
    html += `<span class="line-num${i === currentLine ? ' active' : ''}">${i}</span>`;
  }
  ln.innerHTML = html;
  ln.scrollTop = content.scrollTop;
}

function onSearch() { renderTabs(); }

async function exportData() {
  const data = { version: 3, exportedAt: new Date().toISOString(), notes, settings };
  const dataString = JSON.stringify(data);
  const encrypted = await encryptData(dataString, APP_PASSWORD);
  const blob = new Blob([encrypted], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `notepad-backup-encrypted-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

async function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      let data;
      try {
        data = JSON.parse(e.target.result);
      } catch {
        const decrypted = await decryptData(e.target.result, APP_PASSWORD);
        if (!decrypted) {
          alert('❌ Wrong password for imported file or corrupted file.');
          return;
        }
        data = JSON.parse(decrypted);
      }

      if (data.notes && Array.isArray(data.notes)) {
        notes = data.notes;
        if (data.settings) {
          settings = { ...settings, ...data.settings };
          saveSettings(); applySettings();
        }
        activeId = null;
        saveToStorage(); renderTabs();
        if (notes.length > 0) selectNote(notes[0].id);
        else showEmpty();
        alert('✅ Imported successfully! (' + notes.length + ' notes)');
      } else {
        alert('❌ Invalid file format.');
      }
    } catch { alert('❌ Error reading file.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function showClearModal() { document.getElementById('clearModal').classList.add('show'); }
function hideClearModal() { document.getElementById('clearModal').classList.remove('show'); }

function clearAllData() {
  notes = []; activeId = null;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(STORAGE_KEY + '_active');
  localStorage.removeItem(SETTINGS_KEY);
  renderTabs(); showEmpty(); setSaveStatus('saved'); hideClearModal();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebarMobile() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); addNote(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'r' && !e.shiftKey && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault(); renameNote();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'p') { 
    e.preventDefault(); 
    setViewMode(settings.viewMode === 'edit' ? 'preview' : 'edit'); 
  }
});

window.addEventListener('resize', () => { 
  if (activeId && settings.viewMode === 'edit') updateLineNumbers(); 
});

init();
</script>
